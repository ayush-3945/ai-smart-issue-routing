name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install Server Dependencies
      run: |
        cd server
        npm ci

    - name: Run Jest Unit Tests
      env:
        JWT_SECRET: ci_jwt_secret_12345
        JWT_REFRESH_SECRET: ci_refresh_secret_12345
      run: |
        cd server
        npm test -- --coverage